services:
  api:
    build: .
    environment:
      PORT: 4000
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
    ports: ["4000:4000"]
    restart: unless-stopped
  web:
    build: frontend
    depends_on: [api]
    ports: ["8080:80"]
    restart: unless-stopped


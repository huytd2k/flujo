name: Publish Krea 2 worker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: v0.1
  push:
    tags:
      - "worker-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free space for the 18.6 GB model bundle
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then tag="${GITHUB_REF_NAME#worker-}"; fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flujo-krea2:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          provenance: mode=max
          sbom: true


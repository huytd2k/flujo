openapi: 3.1.0
info: {title: Flujo API, version: 0.1.0}
paths:
  /api/health:
    get:
      responses: {'200': {description: Gateway health}}
  /api/workers:
    post:
      description: Return the configured local ComfyUI worker, or provision a RunPod Pod in runpod mode.
      responses: {'201': {description: RunPod Pod, content: {application/json: {schema: {$ref: '#/components/schemas/Pod'}}}}}
  /api/workers/{podId}:
    get:
      parameters: [{$ref: '#/components/parameters/PodId'}]
      responses: {'200': {description: Current RunPod Pod state}}
    delete:
      description: Permanently terminate the Pod and end GPU billing.
      parameters: [{$ref: '#/components/parameters/PodId'}]
      responses: {'200': {description: Pod terminated}}
  /api/workers/{podId}/health:
    get:
      description: Probe ComfyUI through the RunPod HTTPS proxy.
      parameters: [{$ref: '#/components/parameters/PodId'}]
      responses: {'200': {description: ComfyUI ready}, '502': {description: Runtime not ready}}
  /api/workers/{podId}/generations:
    post:
      description: Submit a ComfyUI API workflow to a ready Pod.
      parameters: [{$ref: '#/components/parameters/PodId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PromptRequest'}}}}
      responses: {'200': {description: Prompt accepted, content: {application/json: {schema: {$ref: '#/components/schemas/PromptJob'}}}}}
  /api/workers/{podId}/jobs/{promptId}:
    get:
      parameters: [{$ref: '#/components/parameters/PodId'}, {$ref: '#/components/parameters/PromptId'}]
      responses: {'200': {description: ComfyUI history and output metadata}}
  /api/workers/{podId}/jobs/{promptId}/cancel:
    post:
      parameters: [{$ref: '#/components/parameters/PodId'}, {$ref: '#/components/parameters/PromptId'}]
      responses: {'200': {description: Execution interrupted}}
components:
  parameters:
    PodId: {name: podId, in: path, required: true, schema: {type: string}}
    PromptId: {name: promptId, in: path, required: true, schema: {type: string}}
  schemas:
    Pod:
      type: object
      required: [id]
      properties: {id: {type: string}, desiredStatus: {type: string}, costPerHr: {type: number}}
    PromptRequest:
      type: object
      required: [prompt]
      properties: {prompt: {type: object, additionalProperties: true}, client_id: {type: string}}
    PromptJob:
      type: object
      required: [prompt_id]
      properties: {prompt_id: {type: string}, number: {type: integer}, node_errors: {type: object}}

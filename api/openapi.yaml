openapi: 3.1.0
info:
  title: Flujo Runner API
  version: 0.3.0
paths:
  /api/health:
    get:
      responses:
        '200': {description: Backend health}
  /api/runners:
    get:
      description: List runner definitions and their JSON input/output schemas.
      responses:
        '200': {description: Runner definitions}
  /api/runners/{runnerId}/instances:
    post:
      description: Spin an instance of a runner.
      parameters: [{$ref: '#/components/parameters/RunnerId'}]
      responses:
        '201': {description: Runner instance}
  /api/runner-instances:
    get:
      description: List active runner instances.
      responses:
        '200': {description: Runner instances}
  /api/runner-instances/{instanceId}:
    get:
      description: Resolve a runner instance and its output port.
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200': {description: Runner instance}
    delete:
      description: Stop a runner instance.
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200': {description: Runner stopped}
  /api/runner-instances/{instanceId}/health:
    get:
      description: Check whether a runner can accept runs.
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200': {description: Runner readiness}
  /api/runner-instances/{instanceId}/dependencies:
    get:
      description: Check every declared dependency after spinning a runner, including GPU count and file MD5.
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200': {description: Complete dependency report with errors and warnings}
  /api/runner-instances/{instanceId}/outputs:
    get:
      description: Proxy a generated runner output through the Flujo server.
      parameters:
        - {$ref: '#/components/parameters/InstanceId'}
        - {name: filename, in: query, required: true, schema: {type: string}}
        - {name: subfolder, in: query, required: false, schema: {type: string}}
        - {name: type, in: query, required: false, schema: {type: string, default: output}}
      responses:
        '200': {description: Generated image bytes}
        '502': {description: Runner output unavailable}
  /api/runner-instances/{instanceId}/logs:
    get:
      description: Stream raw runner logs using server-sent events.
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200': {description: Runner log event stream}
  /api/runner-instances/{instanceId}/runs:
    post:
      description: Submit a run to a ready, previously checked runner instance.
      parameters: [{$ref: '#/components/parameters/InstanceId'}]
      responses:
        '200': {description: Run accepted}
  /api/runner-instances/{instanceId}/runs/{runId}:
    get:
      description: Read the normalized generation state and outputs.
      parameters:
        - {$ref: '#/components/parameters/InstanceId'}
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: Run status}
  /api/runner-instances/{instanceId}/runs/{runId}/cancel:
    post:
      description: Cancel an active run.
      parameters:
        - {$ref: '#/components/parameters/InstanceId'}
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: Run cancelled}
components:
  parameters:
    RunnerId: {name: runnerId, in: path, required: true, schema: {type: string}}
    InstanceId: {name: instanceId, in: path, required: true, schema: {type: string}}
    RunId: {name: runId, in: path, required: true, schema: {type: string}}
